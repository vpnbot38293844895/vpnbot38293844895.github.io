<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            margin-top: 30px;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        h2 { margin-bottom: 5px; }
        p { color: var(--tg-theme-hint-color, #999999); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h2>Твоя подписка готова</h2>
        <p>Мы скопируем ссылку и откроем приложение. Вставь её в раздел «Подписки» (Subscriptions).</p>

        <button class="btn" onclick="connectVPN()">Скопировать и Открыть</button>
    </div>

    <script>
        // Сообщаем Telegram, что приложение готово
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Открываем на весь экран

        function connectVPN() {
            // Получаем ссылку на подписку из URL
            const urlParams = new URLSearchParams(window.location.search);
            const subUrl = urlParams.get('sub');
            
            if (!subUrl) return alert("Ошибка: ссылка не найдена!");

            // 1. Копируем в буфер обмена
            navigator.clipboard.writeText(subUrl).then(() => {
                
                // 2. Определяем ОС и перекидываем в приложение
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                
                if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    // Для iOS пытаемся открыть Happ (или перекидываем в App Store)
                    window.location.href = "happ://"; // Схема приложения (если известна), иначе сразу в магазин
                    setTimeout(() => {
                        window.location.href = "https://apps.apple.com/app/id_твоего_приложения_happ";
                    }, 1000);
                } else if (/android/i.test(userAgent)) {
                    // Для Android открываем v2rayNG
                    window.location.href = "v2rayng://"; 
                    setTimeout(() => {
                        window.location.href = "https://play.google.com/store/apps/details?id=com.v2ray.ang";
                    }, 1000);
                } else {
                    alert("Ссылка скопирована! Открой приложение VPN.");
                }

            }).catch(err => {
                alert("Не удалось скопировать ссылку. Скопируй её вручную: " + subUrl);
            });
        }
    </script>
</body>
</html>
