<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); text-align: center; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; }
        .btn { background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; width: 100%; max-width: 320px; margin-top: 20px; cursor: pointer; transition: background-color 0.1s; }
        .btn.success { background-color: #4caf50; }
    </style>
</head>
<body>
    <div style="font-size: 60px;">🚀</div>
    <h2>Подписка готова</h2>
    <p style="color: var(--tg-theme-hint-color, #999);">Нажми кнопку ниже. Ссылка скопируется, и откроется приложение.</p>
    <button id="mainBtn" class="btn" onclick="connect()">СКОПИРОВАТЬ И ОТКРЫТЬ</button>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        function connect() {
            const params = new URLSearchParams(window.location.search);
            const subUrl = params.get('sub');

            if (!subUrl || subUrl === 'null') {
                WebApp.showAlert("Ошибка: Ключ не получен. Обнови профиль в боте.");
                return;
            }

            // 1. СИНХРОННОЕ КОПИРОВАНИЕ
            const textArea = document.createElement('textarea');
            textArea.value = subUrl;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'absolute';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            textArea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                if (WebApp.HapticFeedback) WebApp.HapticFeedback.notificationOccurred('success');
            } catch (err) {}
            document.body.removeChild(textArea);

            // 2. ВИЗУАЛ
            const btn = document.getElementById('mainBtn');
            btn.classList.add('success');
            btn.innerHTML = "✅ ОТКРЫВАЕМ...";

            // 3. БЕСШОВНЫЙ РЕДИРЕКТ
            const ua = navigator.userAgent.toLowerCase();
            const isiOS = /iphone|ipad|ipod/.test(ua);
            const appScheme = isiOS ? "happ://" : "v2rayng://";
            const storeLink = isiOS ? "https://apps.apple.com/app/id1626108138" : "https://play.google.com/store/apps/details?id=com.v2ray.ang";

            // Отслеживаем, показала ли iOS системное окно или свернулся ли Telegram
            let appOpened = false;
            window.addEventListener('blur', () => appOpened = true);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) appOpened = true;
            });

            // Пробиваем песочницу iOS
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = appScheme;
            document.body.appendChild(iframe);

            // Дублируем стандартным методом для страховки
            setTimeout(() => { window.location.href = appScheme; }, 100);

            // 4. ПЕРЕХОД В МАГАЗИН (если приложения нет)
            setTimeout(() => {
                // Если фокус на окне остался, значит приложение не запустилось
                if (!appOpened && !document.hidden) {
                    WebApp.openLink(storeLink);
                }
            }, 2500);
        }
    </script>
</body>
</html>
