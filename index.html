<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); text-align: center; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; }
        .btn { background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; width: 100%; max-width: 320px; margin-top: 20px; cursor: pointer; transition: background-color 0.1s; }
        .btn.success { background-color: #4caf50; }
    </style>
</head>
<body>
    <div style="font-size: 60px;">🚀</div>
    <h2>Подписка готова</h2>
    <p style="color: var(--tg-theme-hint-color, #999);">Нажми кнопку ниже. Ссылка скопируется, и откроется приложение.</p>
    <button id="mainBtn" class="btn" onclick="connect()">СКОПИРОВАТЬ И ОТКРЫТЬ</button>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        function connect() {
            const params = new URLSearchParams(window.location.search);
            const subUrl = params.get('sub');

            if (!subUrl || subUrl === 'null') {
                WebApp.showAlert("Ошибка: Ключ не получен. Обнови профиль в боте.");
                return;
            }

            // 1. ЖЕЛЕЗОБЕТОННОЕ СИНХРОННОЕ КОПИРОВАНИЕ (БЕЗ PROMISE)
            const textArea = document.createElement('textarea');
            textArea.value = subUrl;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'absolute';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            textArea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                if (WebApp.HapticFeedback) WebApp.HapticFeedback.notificationOccurred('success');
            } catch (err) {}
            
            document.body.removeChild(textArea);

            // 2. МЕНЯЕМ ВИЗУАЛ
            const btn = document.getElementById('mainBtn');
            btn.classList.add('success');
            btn.innerHTML = "✅ ОТКРЫВАЕМ...";

            // 3. МГНОВЕННЫЙ РЕДИРЕКТ (Пока iOS еще считает, что это результат клика)
            const ua = navigator.userAgent.toLowerCase();
            const isiOS = /iphone|ipad|ipod/.test(ua);
            
            if (isiOS) {
                window.location.href = "happ://";
                setTimeout(() => { window.location.href = "https://apps.apple.com/app/id1626108138"; }, 2500);
            } else {
                window.location.href = "v2rayng://";
                setTimeout(() => { window.location.href = "https://play.google.com/store/apps/details?id=com.v2ray.ang"; }, 2500);
            }
        }
    </script>
</body>
</html>
