<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); text-align: center; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; }
        .btn { background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; width: 100%; max-width: 320px; margin-top: 15px; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; text-decoration: none; box-sizing: border-box; }
        .btn:active { transform: scale(0.95); }
        .btn.success { background-color: #4caf50; }
        .btn.download { background-color: #ff9800; }
        .hint { margin-top: 15px; font-size: 14px; color: var(--tg-theme-hint-color, #999); display: none; }
    </style>
</head>
<body>
    <div style="font-size: 60px;">🚀</div>
    <h2 id="title">Подписка готова</h2>
    <p id="desc" style="color: var(--tg-theme-hint-color, #999);">Нажми кнопку ниже. Ключ скопируется, и откроется VPN.</p>
    
    <button id="mainBtn" class="btn" onclick="connect()">СКОПИРОВАТЬ И ОТКРЫТЬ</button>
    
    <a id="openAppBtn" class="btn success" style="display: none;" target="_blank" rel="noopener noreferrer">👉 ИМПОРТИРОВАТЬ VPN</a>
    <button id="downloadBtn" class="btn download" style="display: none;">📥 СКАЧАТЬ ПРИЛОЖЕНИЕ</button>
    
    <div id="hintText" class="hint">Если приложение не установлено, скачай его по кнопке выше.</div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        let isConnecting = false;

        function connect() {
            if (isConnecting) return;
            
            const params = new URLSearchParams(window.location.search);
            const subUrl = params.get('sub');

            if (!subUrl || subUrl === 'null') {
                WebApp.showAlert("Ошибка: Ключ не получен. Обнови профиль в боте.");
                return;
            }

            // 1. КОПИРОВАНИЕ КЛЮЧА В БУФЕР (как запасной вариант)
            const textArea = document.createElement('textarea');
            textArea.value = subUrl;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'absolute';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            textArea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                if (WebApp.HapticFeedback) WebApp.HapticFeedback.notificationOccurred('success');
            } catch (err) {}
            document.body.removeChild(textArea);

            // 2. ИСПОЛЬЗУЕМ САМ КЛЮЧ ДЛЯ ОТКРЫТИЯ ПРИЛОЖЕНИЯ
            const ua = navigator.userAgent.toLowerCase();
            const isiOS = /iphone|ipad|ipod/.test(ua);
            
            // Ссылка начинается на vless:// - телефон сам поймет, какое приложение открыть!
            const appScheme = subUrl; 
            const storeLink = isiOS ? "https://apps.apple.com/app/id6504287215" : "https://play.google.com/store/apps/details?id=com.v2ray.ang";

            // 3. ПЫТАЕМСЯ ОТКРЫТЬ АВТОМАТИЧЕСКИ
            window.location.href = appScheme;
            
            // 4. МЕНЯЕМ ИНТЕРФЕЙС НА СЛУЧАЙ БЛОКИРОВКИ TELEGRAM
            const mainBtn = document.getElementById('mainBtn');
            mainBtn.classList.add('success');
            mainBtn.innerHTML = "✅ СКОПИРОВАНО...";
            isConnecting = true;

            let appOpened = false;
            window.addEventListener('blur', () => appOpened = true);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) appOpened = true;
            });

            // Ждем 1.5 секунды
            setTimeout(() => {
                if (!appOpened && !document.hidden) {
                    mainBtn.style.display = "none";
                    
                    document.getElementById('title').innerText = "Ключ в буфере!";
                    document.getElementById('desc').innerText = "Нажми кнопку ниже, чтобы импортировать ключ или скачать приложение.";
                    
                    const openAppBtn = document.getElementById('openAppBtn');
                    openAppBtn.href = appScheme;
                    openAppBtn.style.display = "flex";
                    // Закрываем шторку при клике
                    openAppBtn.onclick = () => { setTimeout(() => WebApp.close(), 500); };
                    
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.onclick = () => { WebApp.openLink(storeLink); };
                    downloadBtn.style.display = "flex";
                    
                    document.getElementById('hintText').style.display = "block";
                    if (WebApp.HapticFeedback) WebApp.HapticFeedback.notificationOccurred('warning');
                }
            }, 1500);
        }
    </script>
</body>
</html>
