<script>
    const WebApp = window.Telegram.WebApp;
    WebApp.ready();
    WebApp.expand();

    function connect() {
        const params = new URLSearchParams(window.location.search);
        // URLSearchParams уже декодирует строку, decodeURIComponent тут не нужен
        const subUrl = params.get('sub');

        if (!subUrl || subUrl === 'null') {
            WebApp.showAlert("Ошибка: Ключ не получен. Попробуй обновить профиль в боте.");
            return;
        }

        // Пытаемся скопировать через современный API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(subUrl).then(() => {
                handleRedirection();
            });
        } else {
            // Резервный метод копирования
            const input = document.createElement('input');
            input.value = subUrl;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            handleRedirection();
        }
    }

    function handleRedirection() {
        WebApp.HapticFeedback.notificationOccurred('success');
        
        const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isiOS) {
            // Для iOS Happ открывается через ссылку на конфиг или просто в буфер
            window.location.href = "happ://";
            setTimeout(() => { window.location.href = "https://apps.apple.com/app/id1626108138"; }, 1500);
        } else {
            window.location.href = "v2rayng://";
            setTimeout(() => { window.location.href = "https://play.google.com/store/apps/details?id=com.v2ray.ang"; }, 1500);
        }
    }
</script>
